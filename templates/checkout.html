{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - ShopZone</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/checkout.css' %}"
    >

</head>


<body>

    <header class="navbar">

        <div class="logo">
            ShopZone
        </div>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/cart/">
                Cart 🛒
            </a>

            <a href="/logout/">
                Logout
            </a>

        </nav>

    </header>


    <main class="checkout-page">

        <div class="checkout-card">

            <h1>
                Checkout
            </h1>

            <p class="checkout-subtitle">
                Complete your order details.
            </p>


            <form
               id="checkout-form"
               method="POST"
          >    
               {% csrf_token %}

               <input
                    type="hidden"
                    id="cart-data"
                    name="cart_data"
               >

                <div class="form-group">

                    <label for="address">
                        Shipping Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="checkout-total">

                    <span>
                        Order Total
                    </span>

                    <strong id="checkout-total">
                        ₹0.00
                    </strong>

                </div>


                <button
                    type="submit"
                    class="place-order-button"
                >
                    Place Order
                </button>

            </form>


            <p
                id="checkout-message"
                class="checkout-message"
            ></p>


        </div>

    </main>


    <script src="{% static 'js/checkout.js' %}"></script>

</body>

</html>
