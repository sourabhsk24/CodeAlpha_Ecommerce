{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShopZone</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/auth.css' %}"
    >

</head>


<body>

    <header class="navbar">

        <div class="logo">
            ShopZone
        </div>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/cart/">
                Cart 🛒
            </a>

            <a href="/register/">
                Register
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to your ShopZone account.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register/">
                    Create Account
                </a>

            </p>

        </div>

    </main>

</body>

</html>
